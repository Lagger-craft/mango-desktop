# MangoWM 0.18 — independent, output-auto-detected desktop profile.
tag_num=9

# Layouts: every tag starts in `tile` (vertical master-stack, windows stacked
# in columns top to bottom) via the tag_rule below. `circle_layout` defines
# what Super+N (switch_layout) cycles through on the current tag;
# `vertical_tile` is the master-stack rotated 90 degrees so windows tile side
# by side. The cycle only changes the current tag and resets on reload.
# (`mmsg get layouts` lists every layout this build has.)
circle_layout=vertical_tile,tile

# Frosted islands: the bar and its popups get compositor blur. Mango only
# blurs anything when the master `blur` switch is on (`blur_layer` alone is
# ignored), and with `blur_optimized=0` every blur samples the cached
# wallpaper instead of live window content. Windows stay opaque
# (opacity 1.0) so window blur never visibly renders, and Steam games are
# excluded with `no_blur`, keeping the fullscreen path free of blur.
blur=1
blur_layer=1
blur_optimized=0
shadows=0
layer_shadows=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

# Snappy transitions: zoom+fade on open, fade on close, short tag/move slides.
# Tune feel at easings.net (curve format x1,y1,x2,y2) or switch types to
# slide/zoom/fade/none; tag_animation_direction picks horizontal (1) or vertical (0).
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.65
fade_out_begin_opacity=0.65
# Horizontal "curtain" tag transitions: tags slide along the direction you
# move across the bar (1 = horizontal), with a slower, softer glide so the
# whole desktop reads as one curtain stroke.
tag_animation_direction=1
animation_duration_tag=350
animation_curve_tag=0.25,0.9,0.2,1
# Bubble feel on window open: soft zoom-out pop with fade.
zoom_initial_ratio=0.85
zoom_end_ratio=0.85
animation_duration_open=170
animation_duration_close=130
animation_duration_move=150
animation_duration_focus=80
animation_curve_open=0.18,1,0.26,1
animation_curve_close=0.3,0.9,0.4,1
animation_curve_move=0.22,1,0.36,1

border_px=2
border_color=0x333a32ff
focus_color=0x9bd45aff
urgent_color=0xe0a044ff
root_color=0x171a17ff
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=10
gap_outer_vertical=10

# User-authorized layout: portrait left, centered against the landscape pair.
# Mango rr:1 rotates HDMI-A-1 90 degrees counter-clockwise.
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:120,x:0,y:0,scale:1,rr:1
monitor_rule=name:DP-1,width:2560,height:1080,refresh:100,x:1080,y:420,scale:1,rr:0,primary:1
monitor_rule=name:DP-2,width:1920,height:1080,refresh:72,x:3640,y:420,scale:1,rr:0

# Window placement: app_id supports regex; Steam games map to steam_app_<id>.
window_rule=monitor:HDMI-A-1,app_id:discord
window_rule=monitor:HDMI-A-1,app_id:vesktop
window_rule=monitor:DP-1,tags:2,app_id:^steam$
window_rule=monitor:DP-1,tags:3,app_id:^steam_app_
# Blur never touches fullscreen games: the master blur switch is on for the
# bar islands, so games opt out of window blur explicitly.
#
# confine_pointer keeps the cursor inside the game surface while the game is
# focused. Proton/XWayland titles grab the mouse with confine_to and Xwayland
# can drop that lock on its own: once it is gone the compositor has nothing
# left to confine the pointer, it escapes to another monitor and the game
# loses mouse capture (the camera stops following the whole screen).
# Deliberately not combined with is_fullscreen: a rule matching every window
# of the app also hits the short-lived Proton helper window and the fullscreen
# churn breaks the capture even worse.
window_rule=app_id:^steam_app_,no_blur:1,confine_pointer:1

# Focus: the fullscreen game lives on DP-1 tag 3. When you hop to another tag
# and come back, the game must recapture input focus automatically — otherwise
# the keyboard/mouse keep going to the wrong window and the game looks frozen
# while it is actually still rendering. focus_cross_tag was defaulting to 0,
# which is exactly what broke it.
focus_cross_tag=1
focus_on_activate=1

# Mouse look in games.
#
# Mango defaults to libinput's ADAPTIVE acceleration (mouse_accel_profile=2):
# slow moves get damped, fast flicks get boosted. Under X11 a game can turn
# acceleration off itself; under Wayland the compositor applies it BEFORE the
# client ever sees the deltas, so the camera feels lossy ("no puedo moverla
# mucho") and jerky on fast movements ("exageradamente brusca"). Flat is a
# 1:1 mapping of the mouse's own sensor, which is what camera control needs.
mouse_accel_profile=1
mouse_accel_speed=0.4

# Do not teleport the cursor to the centre of a window when the focus changes
# through the keyboard: returning to a fullscreen game with alt+tab injected a
# pointer jump that the engine read as a camera flick.
warp_cursor=0

# drm_syncobj timeline support: reduces stutter and input lag in games.
# Requires a restart of the compositor to take effect.
sync_obj_enable=1

# Restore each monitor's last wallpaper and start one lightweight bar per
# output. The bar hosts the QuickShell wallpaper picker (Super+Alt+W).
exec_once=$HOME/mango-desktop/mango/scripts/wallpaper-ctl.sh restore
exec_once=quickshell --path $HOME/mango-desktop/quickshell/shell.qml
# Keep one bounded, local clipboard history watcher for this Mango session.
exec_once=wl-paste --watch $HOME/mango-desktop/mango/scripts/clipboard-menu.sh --watch

# Launchers and menus.
# Windows stack vertically for every tag (`tile` is the vertical master-stack).
# Super+N still cycles to `vertical_tile` (side-by-side windows).
tag_rule=id:*,layout_name:tile

bind=SUPER,Return,spawn,foot
bind=SUPER,W,spawn,zen-browser
bind=SUPER+SHIFT,W,spawn,chromium
bind=SUPER,Up,spawn,$HOME/mango-desktop/mango/scripts/volume-osd.sh up
bind=SUPER,Down,spawn,$HOME/mango-desktop/mango/scripts/volume-osd.sh down
bind=NONE,XF86AudioRaiseVolume,spawn,$HOME/mango-desktop/mango/scripts/volume-osd.sh up
bind=NONE,XF86AudioLowerVolume,spawn,$HOME/mango-desktop/mango/scripts/volume-osd.sh down
bind=NONE,XF86AudioMute,spawn,$HOME/mango-desktop/mango/scripts/volume-osd.sh mute
bind=SUPER,Tab,toggleoverview
# App launcher.
# wofi sizes its layer-shell surface from a percentage of whatever monitor GTK
# resolves, and its own default ("50%" / "40%") is parsed as the literal
# 50x40 first. The percentage pass then races the drun scan, so the window
# came up with random dimensions (50x40, 540x768, 1280x432 measured) and the
# list ended up clipped. Explicit --width/--lines bypass the percentage path
# and pin the size: 440px fits the longest app name, 12 rows stay visible.
bind=SUPER,space,spawn,wofi --show drun --allow-images --width 440 --lines 12 --style $HOME/mango-desktop/mango/wofi.css
bind=SUPER+ALT,W,spawn,quickshell ipc -p $HOME/mango-desktop/quickshell/shell.qml call wallpaper toggle
bind=SUPER,Escape,spawn,quickshell ipc -p $HOME/mango-desktop/quickshell/shell.qml call dashboard toggle
bind=SUPER,V,spawn,$HOME/mango-desktop/mango/scripts/clipboard-menu.sh
bind=SUPER,slash,spawn,$HOME/mango-desktop/mango/scripts/shortcut-reference.sh
bind=SUPER+SHIFT,Q,spawn,$HOME/mango-desktop/mango/scripts/power-menu.sh
bind=SUPER+SHIFT,S,spawn,$HOME/mango-desktop/mango/scripts/screenshot-area.sh
bind=SUPER,Q,killclient

# Cycle the current tag's layout through circle_layout (tile <-> vertical_tile).
bind=SUPER,n,switch_layout

# HJKL follows Vim direction conventions for focus and window movement.
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,J,move_client,down
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,L,move_client,right
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Tags (Mango calls these tags; they function as workspaces).
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Navigation and safe window controls.
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=ALT,F,togglefullscreen
bind=ALT,space,togglefloating
bind=SUPER,T,togglefloating
bind=SUPER,R,reload_config
bind=SUPER+SHIFT,E,quit
