### MangoHud configuration for the MangoWM desktop.
### Linked to ~/.config/MangoHud/MangoHud.conf by install.sh.
### The palette mirrors the shell palette (quickshell/Theme.qml): green accents
### over a deep charcoal surface, so the overlay reads as part of the desktop.
### Reload it inside a running app with Shift_L+F4 (reload_cfg) — no restart.

################ WHAT TO SHOW #################

### GPU — RX 7600 (Navi 33, RDNA2). Load, clocks, temperature, power, fan and
### VRAM usage out of 8 GB. This is the block that tells you whether the game
### is GPU-bound or CPU-bound.
### The card exposes three temperatures: edge, junction (hotspot) and memory
### junction, so all three are shown.
gpu_stats
gpu_temp
gpu_junction_temp
gpu_mem_temp
gpu_power
gpu_core_clock
gpu_mem_clock
vram

### CPU — aggregated only, no per-core rows
cpu_stats
cpu_temp
cpu_mhz

### System RAM
ram

### Frames — the block that actually explains a stutter: average and 1% low
### FPS, frametime, the frametime graph, the active FPS limit and the GPU
### throttling reason (power/thermal).
fps
fps_metrics=avg,0.01
frametime
frame_timing
show_fps_limit
throttling_status
### Same throttling reason, drawn on the frametime graph: the text row sits
### below the frames block, this one lands where the eye already is.
throttling_status_graph

################ WHAT TO HIDE #################

### Per-core load and per-core bars are the rows that list every CPU core.
### cpu_stats above already reports the aggregate load, frequency and temp.
core_load=0
core_bars=0

### Static or low-signal rows: the GPU model never changes, and per-process
### memory duplicates the RAM row.
gpu_name=0
procmem=0

################ COLORS #################
### Hex values without the leading '#'. Same tokens as the shell theme.

text_color=e5e8dc
gpu_color=9bd45a
cpu_color=c8f08d
ram_color=9bd45a
vram_color=c8f08d
frametime_color=9bd45a
engine_color=eb5b5b
io_color=a491d3
battery_color=ff9078
network_color=e07b85
media_player_color=e5e8dc
wine_color=eb5b5b
horizontal_separator_color=9bd45a
background_color=12150f
background_alpha=0.8

### Readable over any wallpaper: dark outline behind the glyphs.
text_outline
text_outline_color=0c0e0c
text_outline_thickness=1.5

################ LAYOUT #################

### Bottom-left: the shell owns the top panel, so the overlay stays clear of it.
position=bottom-left
offset_y=20
font_size=22
round_corners=6

################ KEYS #################
### Toggle the HUD inside the running app, and reload this file without
### restarting the app.
toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
reload_cfg=Shift_L+F4
