#!/usr/bin/nft -f
#
# Host firewall for the mango-desktop profile (Arch Linux, nftables).
#
# Why nftables and not the alternatives:
#   * firewalld  — not installed and not in the Arch repos used here; it adds a
#                   zone/policy abstraction this single-host desktop does not need.
#   * ufw        — an iptables-legacy wrapper; Arch ships iptables-nft, so ufw
#                   fights the native stack.
#   * nftables   — the native kernel firewall, one small file, no extra daemon.
#
# Install (needs sudo):
#   sudo cp nftables/nftables.conf /etc/nftables.conf
#   sudo systemctl enable --now nftables.service
# Verify:
#   sudo nft list ruleset
# Remove everything again:
#   sudo systemctl disable --now nftables.service && sudo rm /etc/nftables.conf
#
# Policy: default-deny inbound, allow all outbound. This machine is a desktop
# behind NAT; inbound is only what you explicitly open below.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    # Loopback: anything talking to itself.
    iif lo accept

    # Already-established traffic (answers to our own outgoing connections).
    ct state established,related accept
    ct state invalid drop

    # ICMP: needed for path MTU discovery and for "ping works" expectations.
    ip protocol icmp accept

    # ICMPv6: without this, IPv6 breaks (neighbour discovery, router
    # solicitation, path MTU). Never drop it.
    ip6 nexthdr ipv6-icmp accept

    # DHCP client (the machine gets its address over the network).
    udp sport 67 udp dport 68 accept

    # mDNS / LLMNR: local device discovery (printers, speakers, screen cast).
    udp dport 5353 accept
    udp dport 5355 accept

    # Steam local networking (in-game voice and LAN discovery).
    tcp dport 27015-27050 accept
    udp dport 27015-27050 accept

    # Discord voice (WebRTC).
    # The DTLS handshake is plain UDP, and the media arrives from the voice
    # server on a different source port than the STUN one, so it is not
    # covered by "established": without these rules the client stays on
    # "Connecting DTLS" forever.
    udp dport 3478 accept      # STUN
    udp dport 19302 accept     # STUN (secondary)
    tcp dport 3478 accept      # TURN over TCP
    udp dport 50000-65535 accept  # voice media servers

    # --- Open a service by adding a rule below this line. --------------
    # sshd is disabled on this machine; enable the rule only if you turn it on.
    # tcp dport 22 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
